<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chroma Dice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--tx:#eef0f8;--mut:#a3a9c2;--bd:rgba(255,255,255,.1);--gl:rgba(255,255,255,.05)}
@property --amb{syntax:'<color>';inherits:true;initial-value:rgba(99,102,241,.2)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:dark}
html.reduce{scroll-behavior:auto}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);background:radial-gradient(900px 520px at 12% -8%,rgba(124,58,237,.24),transparent 60%),radial-gradient(800px 520px at 92% 0,rgba(37,99,235,.2),transparent 60%),#07070b;background-attachment:fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #a78bfa;outline-offset:3px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header{position:sticky;top:0;z-index:20;background:rgba(7,7,11,.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.bar{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;margin-right:auto;text-decoration:none;color:inherit}
.logo span{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#2f7bff);box-shadow:0 0 18px rgba(139,92,246,.5)}
nav{display:flex;gap:4px}
nav a{padding:8px 14px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500;font-size:.95rem;transition:.2s}
nav a:hover{color:var(--tx);background:var(--gl)}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--gl);transition:.2s}
.ib:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
@media(max-width:640px){.bar{padding:10px 14px;gap:8px}nav{order:3;width:100%;justify-content:space-between}nav a{flex:1;text-align:center;padding:8px 4px;font-size:.88rem}}
main{max-width:1120px;margin:0 auto;padding:28px 20px 48px;display:grid;gap:24px}
section{scroll-margin-top:120px}
.panel{background:var(--gl);border:1px solid var(--bd);border-radius:26px;backdrop-filter:blur(18px);box-shadow:0 20px 50px -24px #000}
.stage{--amb:rgba(99,102,241,.2);position:relative;overflow:hidden;padding:clamp(24px,5vw,48px) clamp(14px,4vw,40px);text-align:center;transition:--amb .8s ease}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 65% at 50% 42%,var(--amb),transparent 72%);pointer-events:none}
.stage>*{position:relative}
h1{margin:0;font-size:clamp(2.2rem,8vw,4.4rem);font-weight:800;letter-spacing:.08em;line-height:1;background:linear-gradient(90deg,#c4b5fd,#fff 45%,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:10px 0 0;color:var(--mut);font-size:clamp(.98rem,2.5vw,1.15rem)}
.dice{display:grid;justify-content:center;gap:clamp(12px,3vw,26px);margin:clamp(24px,5vw,40px) 0;min-height:140px;align-content:center}
.dice[data-n="1"]{--s:clamp(120px,34vw,180px);grid-template-columns:var(--s)}
.dice[data-n="2"]{--s:clamp(100px,26vw,150px);grid-template-columns:repeat(2,var(--s))}
.dice[data-n="3"]{--s:clamp(84px,22vw,128px);grid-template-columns:repeat(3,var(--s))}
.dice[data-n="4"]{--s:clamp(88px,26vw,120px);grid-template-columns:repeat(2,var(--s))}
.dice[data-n="5"],.dice[data-n="6"]{--s:clamp(78px,21vw,116px);grid-template-columns:repeat(3,var(--s))}
.dice[data-n]:not([data-n="1"]):not([data-n="2"]):not([data-n="3"]):not([data-n="4"]):not([data-n="5"]):not([data-n="6"]){grid-template-columns:repeat(auto-fit,minmax(min(8vw,64px),1fr));gap:8px}
.dice[data-n]:not([data-n="1"]):not([data-n="2"]):not([data-n="3"]):not([data-n="4"]):not([data-n="5"]):not([data-n="6"]) .body{width:100%;height:auto;aspect-ratio:1}
@media(min-width:720px){.dice[data-n="4"]{grid-template-columns:repeat(4,var(--s))}}
.die{display:grid;justify-items:center;gap:12px}
.body{width:var(--s);height:var(--s);perspective:700px}
.face{position:relative;width:100%;height:100%;border-radius:24%;border:2px solid var(--edge);background:linear-gradient(145deg,var(--hi),var(--c) 48%,var(--lo));box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -12px 18px rgba(0,0,0,.3),0 14px 34px -10px var(--glow),0 0 40px -6px var(--glow);transition:background .25s,box-shadow .25s}
.face::before{content:"";position:absolute;inset:7% 9% 55% 9%;border-radius:40% 40% 60% 60%/60% 60% 40% 40%;background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,0))}
.face::after{content:"";position:absolute;inset:10%;border-radius:20%;border:1px solid rgba(255,255,255,.18)}
.rolling .face{animation:tumble .55s linear infinite}
.landed .face{animation:land .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes tumble{0%{transform:translateY(0) rotate3d(1,1,0,0)}25%{transform:translateY(-22px) rotate3d(1,1,0,180deg)}50%{transform:translateY(0) rotate3d(1,1,0,360deg)}75%{transform:translateY(-14px) rotate3d(1,1,0,540deg)}100%{transform:translateY(0) rotate3d(1,1,0,720deg)}}
@keyframes land{0%{transform:scale(1.18)}100%{transform:scale(1)}}
.dname{font-weight:600;font-size:.95rem;min-height:1.4em}
[data-color=none]{--hi:#2c2f3f;--c:#1b1d29;--lo:#10111a;--edge:rgba(255,255,255,.16);--glow:rgba(120,120,170,.14)}
[data-color=purple]{--hi:#b79bff;--c:#8b5cf6;--lo:#5428c9;--edge:#c9b8ff;--glow:rgba(139,92,246,.7)}
[data-color=green]{--hi:#6df5b6;--c:#10d98a;--lo:#067a4d;--edge:#8ff7c8;--glow:rgba(16,217,138,.6)}
[data-color=yellow]{--hi:#ffe680;--c:#fbbf24;--lo:#c58503;--edge:#ffeba8;--glow:rgba(251,191,36,.6)}
[data-color=red]{--hi:#ff6b87;--c:#e11d48;--lo:#85102a;--edge:#ff93a9;--glow:rgba(225,29,72,.65)}
[data-color=orange]{--hi:#ffab62;--c:#fb7a1e;--lo:#bd4a08;--edge:#ffc392;--glow:rgba(251,122,30,.65)}
[data-color=blue]{--hi:#82b2ff;--c:#2f7bff;--lo:#123fbb;--edge:#a3c6ff;--glow:rgba(47,123,255,.7)}
.qty{display:inline-flex;gap:4px;padding:4px;border-radius:14px;border:1px solid var(--bd);background:rgba(0,0,0,.3)}
.qty button{width:42px;height:42px;border-radius:10px;border:0;background:none;color:var(--mut);font-weight:600;transition:.2s}
.qty button:hover:not(:disabled){color:var(--tx);background:var(--gl)}
.qty button[aria-checked=true]{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;box-shadow:0 0 14px rgba(124,58,237,.5)}
.qty button:disabled,.ib:disabled{opacity:.5;cursor:not-allowed}
.lbl{display:block;margin-bottom:8px;color:var(--mut);font-size:.88rem}
.roll{display:inline-flex;align-items:center;justify-content:center;gap:12px;margin-top:26px;min-width:min(100%,300px);min-height:68px;padding:0 44px;border:0;border-radius:999px;font-size:1.5rem;font-weight:800;letter-spacing:.14em;color:#fff;background:linear-gradient(135deg,#8b5cf6,#2f7bff);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 10px 34px -6px rgba(124,58,237,.8),0 0 60px -10px rgba(47,123,255,.8);transition:transform .15s,box-shadow .2s,filter .2s}
.roll:hover:not(:disabled){transform:translateY(-3px);filter:brightness(1.12)}
.roll:active:not(:disabled){transform:scale(.95)}
.roll:disabled{cursor:progress;filter:saturate(.6) brightness(.85)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{margin:12px 0 0;color:var(--mut);font-size:.85rem}
.meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 28px;margin-top:28px;padding-top:22px;border-top:1px solid var(--bd)}
.cnt b{display:block;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.cnt b.bump{animation:land .35s}
.cnt small{color:var(--mut)}
.recent{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:30px}
.recent:empty::before{content:"Your last rolls will appear here";color:var(--mut);font-size:.9rem}
.chip{display:inline-flex;gap:4px;padding:6px 9px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--bd)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--glow);border:1px solid var(--edge);display:inline-block;flex:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.panel.p{padding:24px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h2{margin:0;font-size:1.25rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--gl);font-size:.88rem;font-weight:600;transition:.2s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.danger:hover{border-color:#f43f5e;color:#fda4af}
.btn.go{background:#7c3aed;border-color:#8b5cf6}
ol{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:480px;overflow:auto}
.h{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid transparent}
.h.new{border-color:rgba(167,139,250,.55);box-shadow:0 0 18px -4px rgba(139,92,246,.6)}
.h .n{font-weight:700;min-width:46px;font-variant-numeric:tabular-nums;color:var(--mut)}
.h .d{display:flex;gap:5px;flex:none}
.h .t{font-size:.9rem;color:var(--mut);overflow-wrap:anywhere}
.empty{color:var(--mut);padding:18px 4px}
.sr1{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;margin-bottom:14px}
.sr1 .nm{font-weight:600}
.sr1 .v{font-variant-numeric:tabular-nums;color:var(--mut);font-size:.92rem}
.track{grid-column:1/-1;height:10px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--lo),var(--c));box-shadow:0 0 12px var(--glow);transition:width .6s ease}
.note{margin:6px 0 0;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.28);color:var(--mut);font-size:.88rem}
.tot{display:flex;gap:28px;margin-bottom:20px}
.tot b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.tot small{color:var(--mut)}
footer{max-width:1120px;margin:0 auto;padding:0 20px 36px;color:var(--mut);font-size:.85rem;text-align:center}
dialog{width:min(92vw,420px);padding:24px;border:1px solid var(--bd);border-radius:22px;background:#13141e;color:var(--tx);box-shadow:0 30px 80px #000}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 8px;font-size:1.2rem}
dialog p{margin:0 0 16px;color:var(--mut);line-height:1.5}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd)}
.sw{width:50px;height:28px;border-radius:99px;border:1px solid var(--bd);background:#2a2c3b;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked=true]{background:#7c3aed}
.sw[aria-checked=true]::after{left:25px}
input[type=range]{width:140px;accent-color:#8b5cf6}
label.ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:.92rem}

/* Chroma Dice controls and dice details */
.modeBtn{display:inline-flex;align-items:center;gap:9px;padding:10px 13px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.3);font-size:.88rem;font-weight:700}
.modeBtn[aria-pressed=true]{border-color:#a78bfa;background:rgba(124,58,237,.22);box-shadow:0 0 18px rgba(124,58,237,.18)}
.modeState{font-size:.72rem;letter-spacing:.08em;color:var(--mut)}
.modeBtn[aria-pressed=true] .modeState{color:#c4b5fd}
.appearance{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--bd)}
.appearance .lbl{margin:0}
.appearance select{max-width:220px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:#11121b;color:var(--tx);font:inherit}
.face .pip{position:absolute;z-index:2;width:12%;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.25),0 0 10px rgba(255,255,255,.28)}
#dice.anti-ban .face{filter:blur(10px);transform:scale(.98)}
#dice.anti-ban .dname{visibility:hidden}
#dice.slow-hidden .die:not(.revealed) .face{filter:blur(12px);opacity:.55}
#dice.slow-hidden .die:not(.revealed) .dname{visibility:hidden}
#dice.anti-ban.slow-hidden .face{filter:blur(14px)}
#revealTools{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
#revealTools[hidden]{display:none}
#revealStatus{margin:0}
@media(max-width:640px){.meta{gap:14px}.modeBtn{font-size:.78rem;padding:9px}.appearance{gap:8px}.appearance select{width:100%;max-width:none}}

.reduce *,.reduce *::before,.reduce *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#roller" aria-label="Chroma Dice home"><span><svg class="i" viewBox="0 0 24 24"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></svg></span>CHROMA DICE</a>
<nav aria-label="Main"><a href="#roller">Dice Roller</a><a href="#history">History</a></nav>
<button class="ib" id="setBtn" aria-label="Open settings"><svg class="i" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div></header>
<main>
<section id="roller" class="panel stage" aria-labelledby="ttl">
<h1 id="ttl">CHROMA DICE</h1>
<p class="sub">Roll the colours. Reveal your next result.</p>
<div class="dice" id="dice" role="group" aria-label="Dice results"></div>
<div><label class="lbl" id="qlbl" for="diceCount">Number of dice (1–100)</label><input id="diceCount" type="number" min="1" max="100" value="1" inputmode="numeric" aria-labelledby="qlbl" style="width:120px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:#11121b;color:var(--tx);font:inherit;text-align:center"></div>
<button class="roll" id="roll"><span id="rollTxt">ROLL</span></button>
<p class="hint">Press R to roll</p>
<div class="meta">
 <div class="cnt"><b id="count">0</b><small>Total rolls</small></div>
 <button class="modeBtn" id="antiBtn" type="button" aria-pressed="false">Anti Ban Mode <span class="modeState">OFF</span></button>
 <button class="modeBtn" id="slowBtn" type="button" aria-pressed="false">Slow Reveal <span class="modeState">OFF</span></button>
 <div id="revealTools" hidden><label class="lbl" for="revealCount">Colours per reveal</label><input id="revealCount" type="number" min="1" max="100" value="1" style="width:76px;padding:8px;border-radius:10px;border:1px solid var(--bd);background:#11121b;color:var(--tx)"><button class="btn go" id="revealBtn" type="button">Reveal next colour</button><span id="revealStatus" class="hint"></span></div>
 <div><span class="lbl">Recent results</span><div class="recent" id="recent"></div></div>
 <button class="ib" id="snd" aria-label="Toggle sound"></button>
 </div>
 <div class="appearance">
  <label class="lbl" for="bgPreset">Background style</label>
  <select id="bgPreset"><option value="midnight">Midnight Glow</option><option value="aurora">Aurora</option><option value="sunset">Sunset</option><option value="ocean">Deep Ocean</option><option value="plain">Pure Black</option><option value="custom">Uploaded image</option></select>
  <label class="btn" for="bgUpload">Upload background image</label><input id="bgUpload" type="file" accept="image/*" hidden>
  <button class="btn" id="removeBg" type="button">Remove image</button>
 </div>
</section>
<div class="cols">
<section id="history" class="panel p" aria-labelledby="hh"><div class="ph"><h2 id="hh">History</h2></div><ol id="hist"></ol></section>
</div>
</main>
<footer>CHROMA DICE · A colourful random dice experience.</footer>
<div class="sr" id="live" aria-live="polite"></div>

<dialog id="setD" aria-labelledby="setT"><h3 id="setT">Settings</h3>
<div class="row"><span>Rolling sound</span><button class="sw" id="swS" role="switch" aria-label="Rolling sound"></button></div>
<div class="row"><span>Volume</span><input type="range" id="vol" min="0" max="100" aria-label="Volume"></div>
<div class="row"><span>Reduce motion</span><button class="sw" id="swM" role="switch" aria-label="Reduce motion"></button></div>
<div class="acts"><button class="btn" id="setX">Close</button></div></dialog>

<dialog id="cfD" aria-labelledby="cfT"><h3 id="cfT"></h3><p id="cfP"></p><label class="ck" id="cfL" hidden><input type="checkbox" id="cfC"><span id="cfLT"></span></label>
<div class="acts"><button class="btn" id="cfN">Cancel</button><button class="btn go" id="cfY">Confirm</button></div></dialog>
